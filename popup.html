<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="cassette" id="cassette">
  <svg class="shell" viewBox="0 0 480 330" width="480" height="330" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <defs>
      <linearGradient id="plastic" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#5a4636"/><stop offset=".45" stop-color="#433327"/><stop offset="1" stop-color="#2c2119"/>
      </linearGradient>
      <linearGradient id="plasticSheen" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#fff" stop-opacity=".10"/><stop offset=".4" stop-color="#fff" stop-opacity="0"/>
        <stop offset=".75" stop-color="#fff" stop-opacity=".04"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="label" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#f7ecd0"/><stop offset="1" stop-color="#ead8ad"/>
      </linearGradient>
      <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#6b5240"/><stop offset=".5" stop-color="#584232"/><stop offset="1" stop-color="#6b5240"/>
      </linearGradient>
      <linearGradient id="tape" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#6e3a1a"/><stop offset=".35" stop-color="#a5582a"/><stop offset=".7" stop-color="#b8692f"/><stop offset="1" stop-color="#7a4220"/>
      </linearGradient>
      <radialGradient id="reel" cx=".4" cy=".35" r=".75">
        <stop offset="0" stop-color="#ffffff"/><stop offset=".7" stop-color="#eeeeee"/><stop offset="1" stop-color="#c9c9c9"/>
      </radialGradient>
      <linearGradient id="bottom" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#4d3b2d"/><stop offset="1" stop-color="#3a2c21"/>
      </linearGradient>
      <g id="screw">
        <circle r="7.5" fill="#1d1712"/><circle r="6" fill="#3b3b3b"/><circle r="6" fill="url(#plasticSheen)"/>
        <path d="M-3.6 -3.6 L3.6 3.6 M3.6 -3.6 L-3.6 3.6" stroke="#111" stroke-width="1.8" stroke-linecap="round"/>
      </g>
      <g id="hub">
        <circle r="24" fill="url(#reel)" stroke="#b9b9b9" stroke-width="1"/>
        <circle r="14.5" fill="#2a1e15"/>
        <g fill="#f2f2f2">
          <path id="tooth" d="M-2.6 -14.8 L2.6 -14.8 L1.6 -9.6 L-1.6 -9.6 Z"/>
          <use href="#tooth" transform="rotate(60)"/><use href="#tooth" transform="rotate(120)"/>
          <use href="#tooth" transform="rotate(180)"/><use href="#tooth" transform="rotate(240)"/><use href="#tooth" transform="rotate(300)"/>
        </g>
        <circle r="24" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="1.2" transform="translate(-.6 -.6)"/>
      </g>
    </defs>

    <!-- shell -->
    <rect x="4" y="4" width="472" height="322" rx="16" fill="#1c150f"/>
    <rect x="6" y="6" width="468" height="318" rx="15" fill="url(#plastic)"/>
    <rect x="6" y="6" width="468" height="318" rx="15" fill="url(#plasticSheen)"/>

    <!-- label -->
    <rect x="28" y="26" width="424" height="208" rx="5" fill="url(#label)"/>
    <rect x="28" y="26" width="424" height="208" rx="5" fill="none" stroke="#c7b285" stroke-width="1"/>
    <!-- writing lines -->
    <g stroke="#5c4a32" stroke-width="1" stroke-opacity=".75">
      <line x1="84" y1="54" x2="440" y2="54"/>
      <line x1="84" y1="80" x2="440" y2="80"/>
      <line x1="84" y1="106" x2="440" y2="106"/>
    </g>
    <text x="294" y="124" font-family="Helvetica Neue, Arial, sans-serif" font-size="9.5" fill="#3a2e1f" letter-spacing=".5">N.R.</text>

    <!-- window band -->
    <rect x="40" y="132" width="400" height="66" fill="url(#band)"/>
    <g stroke="#3c2d22" stroke-width="1.4">
      <line x1="44" y1="140" x2="112" y2="140"/><line x1="44" y1="145" x2="112" y2="145"/><line x1="44" y1="150" x2="112" y2="150"/>
      <line x1="44" y1="155" x2="112" y2="155"/><line x1="44" y1="160" x2="112" y2="160"/><line x1="44" y1="165" x2="112" y2="165"/>
      <line x1="44" y1="170" x2="112" y2="170"/><line x1="44" y1="175" x2="112" y2="175"/><line x1="44" y1="180" x2="112" y2="180"/>
      <line x1="44" y1="185" x2="112" y2="185"/><line x1="44" y1="190" x2="112" y2="190"/>
      <line x1="368" y1="140" x2="436" y2="140"/><line x1="368" y1="145" x2="436" y2="145"/><line x1="368" y1="150" x2="436" y2="150"/>
      <line x1="368" y1="155" x2="436" y2="155"/><line x1="368" y1="160" x2="436" y2="160"/><line x1="368" y1="165" x2="436" y2="165"/>
      <line x1="368" y1="170" x2="436" y2="170"/><line x1="368" y1="175" x2="436" y2="175"/><line x1="368" y1="180" x2="436" y2="180"/>
      <line x1="368" y1="185" x2="436" y2="185"/><line x1="368" y1="190" x2="436" y2="190"/>
    </g>
    <!-- central window -->
    <rect x="118" y="136" width="244" height="58" rx="29" fill="#2e2219" stroke="#1d150f" stroke-width="1.5"/>
    <!-- tape pack visible through the window -->
    <rect id="tapePack" x="196" y="143" width="88" height="44" rx="4" fill="url(#tape)"/>
    <rect x="232" y="143" width="5" height="44" fill="#5a2f15" opacity=".55"/>
    <!-- glare on the window -->
    <rect x="118" y="136" width="244" height="58" rx="29" fill="#fff" opacity=".05"/>
    <path d="M140 141 L340 141" stroke="#fff" stroke-opacity=".12" stroke-width="2" stroke-linecap="round"/>

    <!-- CASSETTE TAPE stripe -->
    <g>
      <line x1="40" y1="205" x2="440" y2="205" stroke="#2a2118" stroke-width="1.2"/>
      <line x1="40" y1="227" x2="440" y2="227" stroke="#2a2118" stroke-width="1.2"/>
      <line x1="40" y1="216" x2="168" y2="216" stroke="#2a2118" stroke-width="2.4"/>
      <line x1="312" y1="216" x2="440" y2="216" stroke="#2a2118" stroke-width="2.4"/>
      <text x="240" y="220.5" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="12.5" letter-spacing="1.2" fill="#2a2118">CASSETTE TAPE</text>
    </g>

    <!-- bottom guard -->
    <path d="M98 326 L124 246 L356 246 L382 326 Z" fill="url(#bottom)" stroke="#241b14" stroke-width="1.5"/>
    <path d="M124 246 L356 246" stroke="#7a6150" stroke-width="1" stroke-opacity=".6"/>
    <circle cx="148" cy="294" r="9.5" fill="#0d0a08"/>
    <circle cx="332" cy="294" r="9.5" fill="#0d0a08"/>
    <rect x="187" y="284" width="17" height="17" rx="2" fill="#0d0a08"/>
    <rect x="276" y="284" width="17" height="17" rx="2" fill="#0d0a08"/>
    <path d="M214 312 L220 302 L260 302 L266 312 Z" fill="#2a2018"/>
    <rect x="232" y="304" width="16" height="7" fill="#0d0a08"/>
    <use href="#screw" x="240" y="268"/>

    <!-- corner screws -->
    <use href="#screw" x="20" y="18"/><use href="#screw" x="460" y="18"/>
    <use href="#screw" x="20" y="312"/><use href="#screw" x="460" y="312"/>

    <!-- reels (rotated by popup.js) -->
    <g transform="translate(163 165)"><g id="reelL"><use href="#hub"/></g></g>
    <g transform="translate(317 165)"><g id="reelR"><use href="#hub"/></g></g>
  </svg>

  <!-- interactive parts laid over the label -->
  <button id="side" class="side" title="Flip the tape: side A = clean tape, side B = worn tape">A</button>

  <div class="line l1">
    <span id="title" class="ink big">Cassette Filter</span>
    <span id="status" class="ink note">click IN to play this tab on tape</span>
  </div>
  <div class="line l2">
    <label class="ink">hiss <input id="hiss" type="range" min="0" max="100"></label>
    <label class="ink">wobble <input id="wobble" type="range" min="0" max="100"></label>
  </div>
  <div class="line l3">
    <label class="ink">warmth <input id="warmth" type="range" min="0" max="100"></label>
    <label class="ink">volume <input id="volume" type="range" min="0" max="100"></label>
  </div>

  <div class="nr">
    <button id="in" class="box" role="switch" aria-checked="false"><span class="chk"></span>IN</button>
    <button id="out" class="box" role="switch" aria-checked="true"><span class="chk"></span>OUT</button>
  </div>
</div>
<script src="popup.js"></script>
</body>
</html>
